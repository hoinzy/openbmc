# AMI SioDxe requires the AST2500 Super I/O configuration interface before it
# creates the host's PNP0501 serial devices.  This has security implications;
# keep the opt-in scoped to this machine and retain U-Boot's other isolation.
CONFIG_ASPEED_ALLOW_DANGEROUS_BACKDOORS=y
CONFIG_ASPEED_ENABLE_SUPERIO=y
