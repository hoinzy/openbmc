KMACHINE = "aspeed"
KERNEL_DEVICETREE = "aspeed/${KMACHINE}-bmc-asrock-${MACHINE}.dtb"

UBOOT_DEVICETREE = "ast2500-evb"
UBOOT_MACHINE = "evb-ast2500_defconfig"

FLASH_SIZE = "65536"

# A 1 MiB XZ dictionary with the ARM branch filter saves roughly 4 MiB versus
# the generic 128 KiB SquashFS default.  The AST2500 has 512 MiB RAM, and this
# block size is supported by the in-tree SquashFS/XZ decoder.
EXTRA_IMAGECMD:squashfs-xz = "-b 1M -Xbcj arm"

require conf/machine/include/ast2500.inc
require conf/machine/include/obmc-bsp-common.inc
require conf/machine/include/asrock.inc
require conf/distro/include/nfs.inc
